services:
  db:
    image: postgres:15
    container_name: histocrypt-db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: ./server
    container_name: histocrypt-backend
    command: gunicorn histocrypt.wsgi --bind 0.0.0.0:8000 --reload
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app
    depends_on:
      - db
    restart: unless-stopped


  nginx:
    build: ./client
    container_name: histocrypt-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    restart: unless-stopped


volumes:
  pgdata:

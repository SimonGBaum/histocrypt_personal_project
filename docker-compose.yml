services:
  db:
    image: postgres:15
    container_name: histocrypt-db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: ./server
    container_name: histocrypt-backend
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app
    depends_on:
      - db
    restart: unless-stopped

volumes:
  pgdata:
